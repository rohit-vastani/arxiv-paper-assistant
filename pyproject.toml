[project]
name = "arxiv-paper-assistant"
version = "0.1.0"
description = "Chat with arXiv papers: search, add, and ask questions with page-cited answers"
readme = "README.md"
authors = [
    { name = "Rohit Vastani", email = "rohitvastani8626@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain[mcp]>=1.4.0",
    "langchain-openai>=1.1.14",
    "python-dotenv>=1.2.0",
    "ipykernel>=7.1.0",
    "langchain-anthropic>=1.4.6",
    "langchain-model-profiles>=0.0.4",
    "langchain-tavily>=0.2.13",
    "tavily-python>=0.7.13",
    "tavily>=1.1.0",
    "langchain-community>=0.4.1",
    "pypdf>=6.13.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.0.3",
    "langgraph-cli>=0.4.9",
    "langgraph-api>=0.5.37",
    "ipywidgets>=8.1.8",
    "sounddevice>=0.5.3",
    "scipy>=1.16.3",
    "langchain-google-vertexai>=3.0.3",
    "langchain-google-genai>=3.1.0",
    "langsmith>=0.8.18",
    "langchain-core>=1.3.3",
    "jupyterlab>=4.5.9",
    "mcp_server_time<=2026.7.10",
    "arxiv>=4.0.1",
    "pymupdf>=1.28.2",
    "pandas>=3.0.6",
    "update>=0.0.1",
    "langchain-docling>=3.0.0",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "aiofiles>=25.1.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "streamlit[pdf]>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paper_agent"